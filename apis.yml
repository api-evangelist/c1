aid: c1
name: C1
description: >-
  C1 (ConductorOne) is an identity and access management platform engineered for
  the AI era. It provides unified access governance across human identities, AI
  agents, and services — agentic identity management, policy-driven access
  controls, just-in-time access, intelligent access reviews, and intent-based
  approval workflows — so organizations can securely govern access to
  applications, infrastructure, AI tools, and MCP servers while automating
  identity lifecycle and access reviews at scale. The ConductorOne platform API
  is an OAuth2 (client-credentials) HTTP API for managing apps, entitlements,
  grants, users, access-request tasks, request catalogs, policies, and webhooks,
  with Go/TypeScript/Python SDKs, the cone and baton CLIs, the open-source Baton
  connector framework, and a hosted MCP control plane for governed agent access.
url: https://raw.githubusercontent.com/api-evangelist/c1/refs/heads/main/apis.yml
