openapi: 3.1.0
info:
  description: The ConductorOne API is a HTTP API for managing ConductorOne resources.
  title: ConductorOne Access Conflict App Resource API
  version: 0.1.0-alpha
servers:
- description: The ConductorOne API server for the current tenant.
  url: https://{tenantDomain}.conductor.one
  variables:
    tenantDomain:
      default: example
      description: The domain of the tenant to use for this request.
security:
- bearerAuth: []
  oauth: []
tags:
- name: App Resource
paths:
  /api/v1/apps/{app_id}/resource_types/{app_resource_type_id}/resources:
    get:
      description: Invokes the c1.api.app.v1.AppResourceService.List method.
      operationId: c1.api.app.v1.AppResourceService.List
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_resource_type_id
        required: true
        schema:
          description: The appResourceTypeId field.
          readOnly: false
          type: string
      - in: query
        name: page_size
        schema:
          description: The pageSize field.
          format: int32
          readOnly: false
          type: integer
      - in: query
        name: page_token
        schema:
          description: The pageToken field.
          readOnly: false
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.AppResourceServiceListResponse'
          description: The AppResourceServiceListResponse message contains a list of results and a nextPageToken if applicable.
      summary: List
      tags:
      - App Resource
      x-speakeasy-group: AppResource
      x-speakeasy-name-override: List
    post:
      description: Invokes the c1.api.app.v1.AppResourceService.CreateManuallyManagedAppResource method.
      operationId: c1.api.app.v1.AppResourceService.CreateManuallyManagedAppResource
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_resource_type_id
        required: true
        schema:
          description: The appResourceTypeId field.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.CreateManuallyManagedAppResourceRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.CreateManuallyManagedAppResourceResponse'
          description: Successful response
      summary: Create Manually Managed App Resource
      tags:
      - App Resource
      x-speakeasy-entity-operation:
        terraform-resource: App Resource#create
      x-speakeasy-group: AppResource
      x-speakeasy-name-override: CreateManuallyManagedAppResource
  /api/v1/apps/{app_id}/resource_types/{app_resource_type_id}/resources/{id}:
    delete:
      description: Invokes the c1.api.app.v1.AppResourceService.DeleteManuallyManagedAppResource method.
      operationId: c1.api.app.v1.AppResourceService.DeleteManuallyManagedAppResource
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_resource_type_id
        required: true
        schema:
          description: The appResourceTypeId field.
          readOnly: false
          type: string
      - in: path
        name: id
        required: true
        schema:
          description: The appResourceId field.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.DeleteManuallyManagedAppResourceRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.DeleteManuallyManagedAppResourceResponse'
          description: Successful response
      summary: Delete Manually Managed App Resource
      tags:
      - App Resource
      x-speakeasy-entity-operation:
        terraform-resource: App Resource#delete
      x-speakeasy-group: AppResource
      x-speakeasy-name-override: DeleteManuallyManagedAppResource
    get:
      description: Invokes the c1.api.app.v1.AppResourceService.Get method.
      operationId: c1.api.app.v1.AppResourceService.Get
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_resource_type_id
        required: true
        schema:
          description: The appResourceTypeId field.
          readOnly: false
          type: string
      - in: path
        name: id
        required: true
        schema:
          description: The id field.
          readOnly: false
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.AppResourceServiceGetResponse'
          description: The app resource service get response contains the app resource view and array of expanded items indicated by the request's expand mask.
      summary: Get
      tags:
      - App Resource
      x-speakeasy-entity-operation:
        terraform-datasource: App Resource#read
        terraform-resource: App Resource#read
      x-speakeasy-group: AppResource
      x-speakeasy-name-override: Get
    post:
      description: Invokes the c1.api.app.v1.AppResourceService.Update method.
      operationId: c1.api.app.v1.AppResourceService.Update
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The app that this resource belongs to.
          readOnly: false
          type: string
      - in: path
        name: app_resource_type_id
        required: true
        schema:
          description: The resource type that this resource is.
          readOnly: false
          type: string
      - in: path
        name: id
        required: true
        schema:
          description: The id of the resource.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.AppResourceServiceUpdateRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.AppResourceServiceUpdateResponse'
          description: Successful response
      summary: Update
      tags:
      - App Resource
      x-speakeasy-entity-operation:
        terraform-resource: App Resource#update
      x-speakeasy-group: AppResource
      x-speakeasy-name-override: Update
  /api/v1/search/app_resource_types:
    post:
      description: Search app resources based on filters specified in the request body.
      operationId: c1.api.app.v1.AppResourceSearch.SearchAppResourceTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.SearchAppResourceTypesRequest'
