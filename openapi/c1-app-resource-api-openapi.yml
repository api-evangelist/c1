          description: The SearchAppResourceTypesResponse message contains a list of results and a nextPageToken if applicable.
      summary: Search App Resource Types
      tags:
      - App Resource
      x-speakeasy-entity-operation:
        terraform-datasource:
        - App Resource Type#read
        - App Resource Types#read
        terraform-resource: null
      x-speakeasy-group: AppResourceSearch
      x-speakeasy-name-override: SearchAppResourceTypes
      x-speakeasy-pagination:
        inputs:
        - in: requestBody
          name: pageToken
          type: cursor
        outputs:
          nextCursor: $.nextPageToken
        type: cursor
  /api/v1/search/app_resources:
    post:
      description: Invokes the c1.api.app.v1.AppResourceSearch.SearchAppResources method.
      operationId: c1.api.app.v1.AppResourceSearch.SearchAppResources
