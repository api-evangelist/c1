openapi: 3.1.0
info:
  description: The ConductorOne API is a HTTP API for managing ConductorOne resources.
  title: ConductorOne Access Conflict Compliance Framework API
  version: 0.1.0-alpha
servers:
- description: The ConductorOne API server for the current tenant.
  url: https://{tenantDomain}.conductor.one
  variables:
    tenantDomain:
      default: example
      description: The domain of the tenant to use for this request.
security:
- bearerAuth: []
  oauth: []
tags:
- name: Compliance Framework
paths:
  /api/v1/attributes/compliance_frameworks:
    get:
      description: Invokes the c1.api.attribute.v1.Attributes.ListComplianceFrameworks method.
      operationId: c1.api.attribute.v1.Attributes.ListComplianceFrameworks
      parameters:
      - in: query
        name: page_size
        schema:
          description: The pageSize field.
          format: int32
          readOnly: false
          type: integer
      - in: query
        name: page_token
        schema:
          description: The pageToken field.
          readOnly: false
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.attribute.v1.ListComplianceFrameworksResponse'
          description: Successful response
      summary: List Compliance Frameworks
      tags:
      - Compliance Framework
      x-speakeasy-entity-operation:
        terraform-datasource: Compliance Frameworks#read
        terraform-resource: null
      x-speakeasy-group: Attributes
      x-speakeasy-name-override: ListComplianceFrameworks
    post:
      description: Create a compliance framework value.
      operationId: c1.api.attribute.v1.Attributes.CreateComplianceFrameworkAttributeValue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.attribute.v1.CreateComplianceFrameworkAttributeValueRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.attribute.v1.CreateComplianceFrameworkAttributeValueResponse'
          description: Successful response
      summary: Create Compliance Framework Attribute Value
      tags:
      - Compliance Framework
      x-speakeasy-entity-operation:
        terraform-resource: Compliance Framework#create
      x-speakeasy-group: Attributes
      x-speakeasy-name-override: CreateComplianceFrameworkAttributeValue
  /api/v1/attributes/compliance_frameworks/{id}:
    delete:
      description: Delete an attribute value by id.
      operationId: c1.api.attribute.v1.Attributes.DeleteComplianceFrameworkAttributeValue
      parameters:
      - in: path
        name: id
        required: true
        schema:
          description: The id field.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.attribute.v1.DeleteComplianceFrameworkAttributeValueRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.attribute.v1.DeleteComplianceFrameworkAttributeValueResponse'
          description: Successful response
      summary: Delete Compliance Framework Attribute Value
      tags:
      - Compliance Framework
      x-speakeasy-entity-operation:
        terraform-resource: Compliance Framework#delete
      x-speakeasy-group: Attributes
      x-speakeasy-name-override: DeleteComplianceFrameworkAttributeValue
    get:
      description: Get an attribute value by id.
      operationId: c1.api.attribute.v1.Attributes.GetComplianceFrameworkAttributeValue
      parameters:
      - in: path
        name: id
        required: true
        schema:
          description: The id field.
          readOnly: false
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.attribute.v1.GetComplianceFrameworkAttributeValueResponse'
          description: Successful response
      summary: Get Compliance Framework Attribute Value
      tags:
      - Compliance Framework
      x-speakeasy-entity-operation:
        terraform-datasource: Compliance Framework#read
        terraform-resource: Compliance Framework#read
      x-speakeasy-group: Attributes
      x-speakeasy-name-override: GetComplianceFrameworkAttributeValue
components:
