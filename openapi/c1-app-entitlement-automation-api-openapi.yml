      title: App Entitlement Service Get Automation Response
      type: object
      x-speakeasy-name-override: AppEntitlementServiceGetAutomationResponse
    c1.api.app.v1.AppEntitlementAutomationRuleCEL:
      description: The AppEntitlementAutomationRuleCEL message.
      nullable: true
