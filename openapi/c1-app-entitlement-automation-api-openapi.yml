openapi: 3.1.0
info:
  description: The ConductorOne API is a HTTP API for managing ConductorOne resources.
  title: ConductorOne Access Conflict App Entitlement Automation API
  version: 0.1.0-alpha
servers:
- description: The ConductorOne API server for the current tenant.
  url: https://{tenantDomain}.conductor.one
  variables:
    tenantDomain:
      default: example
      description: The domain of the tenant to use for this request.
security:
- bearerAuth: []
  oauth: []
tags:
- name: App Entitlement Automation
paths:
  /api/v1/apps/{app_id}/entitlements/{app_entitlement_id}/automation:
    delete:
      description: Invokes the c1.api.app.v1.AppEntitlements.DeleteAutomation method.
      operationId: c1.api.app.v1.AppEntitlements.DeleteAutomation
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_entitlement_id
        required: true
        schema:
          description: The appEntitlementId field.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.DeleteAutomationRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.DeleteAutomationResponse'
          description: Successful response
      summary: Delete Automation
      tags:
      - App Entitlement Automation
      x-speakeasy-entity-operation:
        terraform-resource: App Entitlement Automation#delete
      x-speakeasy-group: AppEntitlements
      x-speakeasy-name-override: DeleteAutomation
    get:
      description: Invokes the c1.api.app.v1.AppEntitlements.GetAutomation method.
      operationId: c1.api.app.v1.AppEntitlements.GetAutomation
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The ID of the app that is associated with the app entitlement.
          readOnly: true
          type: string
      - in: path
        name: app_entitlement_id
        required: true
        schema:
          description: The unique ID for the App Entitlement.
          readOnly: true
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.AppEntitlementServiceGetAutomationResponse'
          description: Successful response
      summary: Get Automation
      tags:
      - App Entitlement Automation
      x-speakeasy-entity-operation:
        terraform-datasource: App Entitlement Automation#read
        terraform-resource: App Entitlement Automation#read
      x-speakeasy-group: AppEntitlements
      x-speakeasy-name-override: GetAutomation
  /api/v1/apps/{app_id}/entitlements/{app_entitlement_id}/automation/create:
    post:
      description: Invokes the c1.api.app.v1.AppEntitlements.CreateAutomation method.
      operationId: c1.api.app.v1.AppEntitlements.CreateAutomation
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The appId field.
          readOnly: false
          type: string
      - in: path
        name: app_entitlement_id
        required: true
        schema:
          description: The appEntitlementId field.
          readOnly: false
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.CreateAutomationRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.CreateAutomationResponse'
          description: Successful response
      summary: Create Automation
      tags:
      - App Entitlement Automation
      x-speakeasy-entity-operation:
        terraform-resource: App Entitlement Automation#create
      x-speakeasy-group: AppEntitlements
      x-speakeasy-name-override: CreateAutomation
  /api/v1/apps/{app_id}/entitlements/{app_entitlement_id}/automation/update:
    post:
      description: Invokes the c1.api.app.v1.AppEntitlements.UpdateAutomation method.
      operationId: c1.api.app.v1.AppEntitlements.UpdateAutomation
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          description: The ID of the app that is associated with the app entitlement.
          readOnly: true
          type: string
      - in: path
        name: app_entitlement_id
        required: true
        schema:
          description: The unique ID for the App Entitlement.
          readOnly: true
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/c1.api.app.v1.AppEntitlementServiceUpdateAutomationRequestInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/c1.api.app.v1.AppEntitlementServiceUpdateAutomationResponse'
          description: Successful response
      summary: Update Automation
      tags:
      - App Entitlement Automation
      x-speakeasy-entity-operation:
        terraform-resource: App Entitlement Automation#update
      x-speakeasy-group: AppEntitlements
      x-speakeasy-name-override: UpdateAutomation
