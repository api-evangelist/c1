          - SYNC_STATUS_DONE
          - SYNC_STATUS_ERROR
          - SYNC_STATUS_DISABLED
          readOnly: false
          type: string
          x-speakeasy-unknown-values: allow
        updatedAt:
          format: date-time
          readOnly: false
          type: string
