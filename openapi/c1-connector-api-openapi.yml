          description: The appId of the app the connector is attached to.
          readOnly: false
          type: string
        clientId:
          description: The client id of the ConnectorCredential.
          readOnly: false
          type: string
        clientSecret:
          description: The client secret of the ConnectorCredential. It's only returned on creation.
          readOnly: false
          type: string
        connectorId:
          description: The connectorId of the connector the credential is associated with.
          readOnly: false
          type: string
        createdAt:
          format: date-time
          readOnly: true
          type: string
        deletedAt:
          format: date-time
          readOnly: true
          type: string
        displayName:
          description: The display name of the ConnectorCredential.
          readOnly: false
          type: string
        expiresTime:
          format: date-time
          readOnly: true
          type: string
        id:
          description: The id of the ConnectorCredential.
          readOnly: false
          type: string
        lastUsedAt:
          format: date-time
          readOnly: true
          type: string
        updatedAt:
